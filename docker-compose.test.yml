services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: buildcost_test
      POSTGRES_USER: buildcost
      POSTGRES_PASSWORD: buildcost
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildcost -d buildcost_test"]
      interval: 5s
      timeout: 5s
      retries: 10
