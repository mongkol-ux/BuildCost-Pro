name: API Tests

on:
  push:
    paths:
      - "apps/api/**"
      - "alembic/**"
      - ".github/workflows/api-tests.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "alembic/**"
      - ".github/workflows/api-tests.yml"

jobs:
  test-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: buildcost_test
          POSTGRES_USER: buildcost
          POSTGRES_PASSWORD: buildcost
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U buildcost -d buildcost_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API dependencies
        run: python -m pip install -r apps/api/requirements.txt
      - name: Run migrations
        env:
          BUILD_COST_ENVIRONMENT: test
          BUILD_COST_DATABASE_URL: postgresql+psycopg://buildcost:buildcost@localhost:5432/buildcost_test
          BUILD_COST_JWT_SECRET_KEY: ci-test-secret
        run: alembic upgrade head
      - name: Run integration tests
        env:
          BUILD_COST_ENVIRONMENT: test
          BUILD_COST_DATABASE_URL: postgresql+psycopg://buildcost:buildcost@localhost:5432/buildcost_test
          BUILD_COST_TEST_DATABASE_URL: postgresql+psycopg://buildcost:buildcost@localhost:5432/buildcost_test
          BUILD_COST_JWT_SECRET_KEY: ci-test-secret
        run: pytest -q apps/api/tests
