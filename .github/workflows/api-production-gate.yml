name: API Production Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-production-gate.yml'
      - 'docs/PRODUCTION_DEPLOYMENT_READINESS.md'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-production-gate.yml'
      - 'docs/PRODUCTION_DEPLOYMENT_READINESS.md'

permissions:
  contents: read

jobs:
  production-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Run authentication/security integration tests
        env:
          BCP_AUTH_SIGNING_KEY: ci-only-key-012345678901234567890123456789
          BCP_CORS_ORIGINS: https://app.example.com
        run: pytest -q

      - name: Reject obvious insecure production configuration
        env:
          BCP_AUTH_SIGNING_KEY: ci-only-key-012345678901234567890123456789
          BCP_CORS_ORIGINS: https://app.example.com
        run: |
          python - <<'PY'
          import os
          key = os.environ['BCP_AUTH_SIGNING_KEY']
          origins = [x.strip() for x in os.environ['BCP_CORS_ORIGINS'].split(',') if x.strip()]
          assert len(key) >= 32
          assert origins and '*' not in origins
          print('production configuration invariants: PASS')
          PY
