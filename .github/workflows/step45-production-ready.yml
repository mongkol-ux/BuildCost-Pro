name: STEP 45 V1.2 Production Ready

on:
  push:
    branches: [main]
    paths:
      - 'docs/STEP-45-V1.2-PRODUCTION-HANDOVER.md'
      - 'docs/IMPLEMENTATION-STATUS-31-55.md'
      - '.github/workflows/step45-production-ready.yml'
  workflow_dispatch:

jobs:
  v1-2-production-ready:
    name: STEP 45 production-ready handover gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Validate STEP 45 handover evidence requirements
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/STEP-45-V1.2-PRODUCTION-HANDOVER.md
          test -f docs/IMPLEMENTATION-STATUS-31-55.md
          grep -q '## Required closure checklist' docs/STEP-45-V1.2-PRODUCTION-HANDOVER.md
          grep -q 'PostgreSQL backup owner' docs/STEP-45-V1.2-PRODUCTION-HANDOVER.md
          grep -q 'non-production restore drill' docs/STEP-45-V1.2-PRODUCTION-HANDOVER.md
          grep -q 'immutable V1.2 release tag' docs/STEP-45-V1.2-PRODUCTION-HANDOVER.md
      - name: Verify release and operations evidence files
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/production-release-gate.yml
          test -f docs/STEP-43-RELEASE-CANDIDATE-ROLLBACK.md
          test -f docs/PRODUCTION_OPERATIONS_V1.0.md
      - name: Verify STEP 45 remains evidence-driven
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^\*\*Status:\*\* IN PROGRESS' docs/STEP-45-V1.2-PRODUCTION-HANDOVER.md
          grep -q '| 45 | V1.2 Production Ready | IN PROGRESS — HANDOVER EVIDENCE PENDING |' docs/IMPLEMENTATION-STATUS-31-55.md
      - name: STEP 45 gate result
        run: |
          echo 'STEP 45 automated evidence framework: PASS'
          echo 'STEP 45 final closure: BLOCKED until dated backup/restore, operational-owner, and immutable-tag evidence is recorded.'
