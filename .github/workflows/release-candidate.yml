name: Production Release Candidate Validation

# Production RC gate — exact-commit validation enabled.

on:
  push:
    branches:
      - release-candidate/**
      - main
  pull_request:
    branches:
      - main

jobs:
  api-rc-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: buildcost
          POSTGRES_PASSWORD: buildcost
          POSTGRES_DB: buildcost
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U buildcost -d buildcost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      BUILD_COST_ENVIRONMENT: production
      BUILD_COST_DATABASE_URL: postgresql+psycopg://buildcost:buildcost@localhost:5432/buildcost
      BUILD_COST_JWT_SECRET: rc-only-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      BUILD_COST_JWT_ISSUER: buildcost-pro
      BUILD_COST_ALLOWED_HOSTS: testserver,localhost
      BUILD_COST_CORS_ORIGINS: http://localhost:3000
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Apply production schema
        run: python -c "from sqlalchemy import create_engine, text; from src.config import get_settings; e=create_engine(get_settings().database_url); c=e.connect(); c.execute(text(open('migrations/001_authentication.sql').read())); c.commit(); c.close()"
      - name: Validate application import
        run: python -c "from src.main import app; from src.config import get_settings; assert app.title == get_settings().app_name"
      - name: Run unit and integration tests
        run: pytest -q
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Production public runtime smoke test
        working-directory: .
        env:
          PRODUCTION_BASE_URL: https://buildcost-pro-production.up.railway.app
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 10 \
              -D /tmp/buildcost-headers.txt \
              -o /tmp/buildcost-health.json \
              "$PRODUCTION_BASE_URL/health"; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "Production health endpoint did not become ready in time."
              exit 1
            fi
            sleep 10
          done
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          body = json.loads(Path('/tmp/buildcost-health.json').read_text())
          assert body == {
              'status': 'ok',
              'service': 'buildcost-pro-api',
              'version': '1.0.0',
          }, body
          print('HEALTH_CONTRACT=PASS')

          # The pull-request gate validates the new security behavior locally.
          # The main-branch gate validates that the deployed public runtime has it.
          if os.environ.get('GITHUB_REF') != 'refs/heads/main':
              print('PUBLIC_HEALTH_SMOKE=PASS')
              print('SECURITY_HEADERS_LOCAL_CI=PASS')
              raise SystemExit(0)

          headers = {}
          for line in Path('/tmp/buildcost-headers.txt').read_text().splitlines():
              if ':' in line:
                  key, value = line.split(':', 1)
                  headers[key.lower().strip()] = value.strip()

          required = {
              'x-content-type-options': 'nosniff',
              'x-frame-options': 'DENY',
              'referrer-policy': 'no-referrer',
          }
          for key, expected in required.items():
              assert headers.get(key) == expected, (key, headers.get(key))

          permissions = headers.get('permissions-policy', '').replace(' ', '')
          assert permissions == 'camera=(),microphone=(),geolocation=()', permissions

          hsts = headers.get('strict-transport-security', '')
          assert 'max-age=31536000' in hsts, hsts
          assert 'includesubdomains' in hsts.lower(), hsts
          print('PUBLIC_PRODUCTION_SMOKE_TEST=PASS')
          print('SECURITY_HEADERS=PASS')
          print('HEALTH_CONTRACT=PASS')
          PY
