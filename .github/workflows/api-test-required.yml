name: API Required Test Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: buildcost
          POSTGRES_PASSWORD: buildcost
          POSTGRES_DB: buildcost
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U buildcost -d buildcost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      BUILD_COST_DATABASE_URL: postgresql+psycopg://buildcost:buildcost@localhost:5432/buildcost
      BUILD_COST_JWT_SECRET: required-ci-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      BUILD_COST_ALLOWED_HOSTS: testserver,localhost
      BUILD_COST_CORS_ORIGINS: http://localhost:3000
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Apply migrations
        run: python -m src.migrate
      - name: Run API tests
        run: pytest -q
