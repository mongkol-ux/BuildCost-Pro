name: STEP 44 Production Release Gate

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  production-release-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: buildcost
          POSTGRES_PASSWORD: buildcost
          POSTGRES_DB: buildcost
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U buildcost -d buildcost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      BUILD_COST_ENVIRONMENT: production
      BUILD_COST_DATABASE_URL: postgresql+psycopg://buildcost:buildcost@localhost:5432/buildcost
      BUILD_COST_JWT_SECRET: rc-only-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      BUILD_COST_JWT_ISSUER: buildcost-pro
      BUILD_COST_ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      BUILD_COST_CORS_ORIGINS: https://buildcost-pro-production.up.railway.app

    steps:
      - name: Checkout approved release
        uses: actions/checkout@v4

      - name: Verify release candidate commit
        run: |
          set -euo pipefail
          echo "RELEASE_COMMIT=$GITHUB_SHA"
          git status --short

      - name: Wait for production Railway services
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          required_contexts=(
            'genuine-blessing - BuildCost-Pro'
            'genuine-blessing - reasonable-determination'
          )
          for attempt in $(seq 1 30); do
            status_json=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status")
            all_passed=true
            for context in "${required_contexts[@]}"; do
              state=$(python - "$context" <<'PY'
          import json, sys
          data=json.loads(sys.stdin.read()) if False else None
          PY
              )
              state=$(python -c 'import json,sys; d=json.load(sys.stdin); c=sys.argv[1]; rows=[x for x in d.get("statuses",[]) if x.get("context")==c]; print(rows[0].get("state","missing") if rows else "missing")' "$context" <<<"$status_json")
              echo "$context=$state"
              if [ "$state" != "success" ]; then
                all_passed=false
              fi
            done
            if [ "$all_passed" = true ]; then
              echo 'RAILWAY_PRODUCTION_SERVICES=PASS'
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo 'Railway production service status did not reach success in time.'
              exit 1
            fi
            sleep 10
          done

      - name: Verify production deployment contract
        run: |
          set -euo pipefail
          test -f apps/api/Dockerfile
          grep -F 'python -m src.migrate && uvicorn src.main:app' apps/api/Dockerfile
          test -f apps/api/railway.toml
          grep -F 'healthcheckPath = "/health"' apps/api/railway.toml
          echo 'DEPLOYMENT_CONTRACT=PASS'

      - name: Verify checked-in migrations
        working-directory: apps/api
        run: |
          set -euo pipefail
          test -f migrations/001_authentication.sql
          test -f migrations/009_search.sql
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m src.migrate
          python - <<'PY'
          from sqlalchemy import create_engine, inspect
          from src.config import get_settings
          tables = set(inspect(create_engine(get_settings().database_url)).get_table_names())
          required = {
              'users','projects','budgets','costs','transactions','boq_revisions',
              'boq_items','resources','suppliers','procurement_requests',
              'purchase_orders','documents','notifications'
          }
          missing = required - tables
          assert not missing, missing
          print('MIGRATION_CHAIN=PASS')
          PY

      - name: Verify production application import and compile
        working-directory: apps/api
        run: |
          set -euo pipefail
          python -c "from src.main import app; assert app.title"
          python -m compileall -q src tests
          echo 'APPLICATION_VALIDATION=PASS'

      - name: Verify production API container smoke contract
        working-directory: apps/api
        run: |
          set -euo pipefail
          docker build --pull -t buildcost-pro-api:step44 .
          docker run -d --rm --name buildcost-pro-step44 \
            -e PORT=8000 \
            -e BUILD_COST_ENVIRONMENT=production \
            -e BUILD_COST_DATABASE_URL="$BUILD_COST_DATABASE_URL" \
            -e BUILD_COST_JWT_SECRET="$BUILD_COST_JWT_SECRET" \
            -e BUILD_COST_JWT_ISSUER="$BUILD_COST_JWT_ISSUER" \
            -e BUILD_COST_ALLOWED_HOSTS="$BUILD_COST_ALLOWED_HOSTS" \
            -e BUILD_COST_CORS_ORIGINS="$BUILD_COST_CORS_ORIGINS" \
            --add-host=host.docker.internal:host-gateway \
            -p 18000:8000 buildcost-pro-api:step44
          cleanup() { docker stop buildcost-pro-step44 >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 -o /tmp/api-health.json http://127.0.0.1:18000/health; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              docker logs buildcost-pro-step44 || true
              exit 1
            fi
            sleep 2
          done
          python - <<'PY'
          import json
          from pathlib import Path
          body = json.loads(Path('/tmp/api-health.json').read_text())
          assert body == {
              'status': 'ok',
              'service': 'buildcost-pro-api',
              'version': '1.0.0',
          }, body
          print('PRODUCTION_API_CONTAINER_SMOKE=PASS')
          PY

      - name: Verify API authentication and protected route boundaries
        working-directory: apps/api
        run: |
          set -euo pipefail
          pytest -q tests/test_auth_integration.py tests/test_auth_security.py tests/test_step39_search.py
          echo 'API_AUTH_ROUTE_BOUNDARIES=PASS'

      - name: Verify production web health and security contract
        env:
          PRODUCTION_WEB_BASE_URL: https://buildcost-pro-production.up.railway.app
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 \
            -D /tmp/web-headers.txt \
            -o /tmp/web-health.json \
            "$PRODUCTION_WEB_BASE_URL/api/health"
          python - <<'PY'
          import json
          from pathlib import Path
          body = json.loads(Path('/tmp/web-health.json').read_text())
          assert body == {
              'status': 'ok',
              'service': 'buildcost-pro-web',
              'version': '1.1.0',
          }, body
          headers = {}
          for line in Path('/tmp/web-headers.txt').read_text().splitlines():
              if ':' in line:
                  key, value = line.split(':', 1)
                  headers[key.lower().strip()] = value.strip()
          assert headers.get('x-content-type-options') == 'nosniff'
          assert headers.get('x-frame-options') == 'DENY'
          assert headers.get('referrer-policy') == 'no-referrer'
          assert headers.get('strict-transport-security') == 'max-age=31536000; includeSubDomains'
          print('PRODUCTION_WEB_HEALTH=PASS')
          print('PRODUCTION_WEB_SECURITY_HEADERS=PASS')
          PY

      - name: Release evidence summary
        run: |
          cat <<'EOF'
          STEP 44 Production Release Gate
          - Approved release commit: verified by checkout
          - Railway production services: verified by GitHub deployment statuses
          - Production migration chain: verified against PostgreSQL 16
          - API production container/runtime contract: verified by container smoke test
          - API authentication/protected route boundaries: verified by release tests
          - Web health/security contract: verified against public production endpoint
          - Rollback procedure: inherited from STEP 43 documented rollback plan
          EOF
